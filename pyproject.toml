[project]
name = "dero-skills"
version = "0.0.0"
description = "Canonical Agent Skills repository and reusable consumer bootstrap."
readme = "README.md"
requires-python = ">=3.12"
# No runtime dependencies: tools/ are stdlib-only and skill scripts are
# self-contained (PEP 723). This manifest exists for the authoring/CI workflow.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.uv]
# This is a workspace of skills, not an installable package.
package = false

[tool.ruff]
# ruff is the authoring formatter + linter for this repo's own Python (tools/,
# scripts, skill scripts, tests). Skill scripts stay self-contained: ruff only
# formats/lints them, it is never a runtime dependency of an installed skill.
# Type checking (ty) is intentionally excluded — the authoring code is small and
# stdlib-only; the strict gate is ruff + pytest + skill validation.
target-version = "py312"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["skills", "tools"]
