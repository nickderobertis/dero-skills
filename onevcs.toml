# onevcs reads this from the publication checkout's base as this repository's default publication policy.
schema_version = 2

# llmlint: ignore-block[changed_behavior_has_e2e] onevcs reads and validates this declaration, not this repository's code, so there is no behavior here for a test of this repo to drive; the user ruled this change adds no tests.
# llmlint: ignore-block[least_privilege_grants] this restates exactly the policy the host's rule already grants dero-skills (change-auto, no approvals), so it widens nothing; the required checks still gate every merge to main.
[policy]
publication = "change-auto"
approvals = "none"
# llmlint: ignore-end[least_privilege_grants]
# llmlint: ignore-end[changed_behavior_has_e2e]
