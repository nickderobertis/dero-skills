# yaml-language-server: $schema=https://raw.githubusercontent.com/nickderobertis/llmlint/main/assets/llmlint.schema.json
# llmlint config — LLM-as-judge checks for invariants ruff/pytest can't express.
# Optional author-time check (not in `just check`): needs the oneharness + llmlint
# binaries and a token. Run with `just lint-llm`. Docs: github.com/nickderobertis/llmlint
# No top-level `version:`: that field only matters when a config is consumed as a
# plugin (a `@`-pinned URL). This is our own consumer config, pinned by no one — a
# version here would be inert and still force a bump on every edit.

# No `include`: llmlint 0.2.31+ lints the whole tree (exclude + .gitignore honored),
# so a no-args run covers everything, including this config for config_lint. Exclude
# only what .gitignore misses and shouldn't be judged.
files:
  exclude:
    - "**/.git/**"
    - "uv.lock"
    - "bun.lock"
    - ".allowlister.json"
    - "gh-secrets.json"

oneharness:
  timeout: 600  # ceiling (not a fixed wait); headroom for the full-repo sweep

plugins:
  # config_lint (bundled, offline) lints this config's own rules.
  - "https://raw.githubusercontent.com/nickderobertis/llmlint/main/assets/config_lint.yml@1"
  # create-repo ongoing fragments for this stack, as LOCAL in-tree paths (we host
  # them, so edits apply immediately; consumers pin the composer's @version URLs).
  - "skills/bootstrap/create-repo/assets/llmlint/base.llmlint.yml"
  - "skills/bootstrap/create-repo/assets/llmlint/shapes/skills-repo.llmlint.yml"
  - "skills/bootstrap/create-repo/assets/llmlint/languages/python.llmlint.yml"
  - "skills/bootstrap/create-repo/assets/llmlint/languages/bash.llmlint.yml"
  - "skills/bootstrap/create-repo/assets/llmlint/ci.llmlint.yml"

# No `agents` block: all rules run on the default agent. Harness/model are left
# unset so `oneharness.toml`'s fallback mode selects them — codex + gpt-5.5 primary,
# claude-code + opus-4.8 secondary — and a Claude Code session (no codex) falls
# through to claude-code without any ONEHARNESS_* env override.

rules:
  - name: python_launched_via_uv
    description: |
      TRUE when every place this file launches Python or pulls in a Python
      package does so through uv — `uv run`, `uv run --script` (PEP 723),
      `uvx` / `uv tool run`, or `uv add` / `uv pip` for dependencies.
      FALSE when Python is executed or installed directly: a bare `python` /
      `python3` invocation, a `#!/usr/bin/env python3` shebang used as the
      primary entry point, `pip` / `pip3` / `pipx`, `poetry run`, or activating
      a virtualenv by hand instead of going through uv.
    files:
      include:
        - "**/*.py"
        - "**/*.sh"
        - "justfile"
        - ".github/workflows/**"
        - "docs/**/*.md"
    relevance: the file runs Python code or installs a Python package
    require_line_attribution: true

  - name: typescript_and_npm_launched_via_bun
    description: |
      TRUE when every place this file runs TypeScript/JavaScript or manages an
      npm package does so through bun — `bun run`, `bun <file>`, `bunx` /
      `bun x`, `bun add`, or `bun install`.
      FALSE when it runs code or manages packages directly with `node`, `npm` /
      `npx`, `pnpm`, or `yarn` instead of bun.
    files:
      include:
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.js"
        - "**/*.mjs"
        - "**/*.sh"
        - "justfile"
        - ".github/workflows/**"
        - "docs/**/*.md"
    relevance: the file runs TypeScript/JavaScript or manages an npm package
    require_line_attribution: true

  - name: single_language_work_runs_directly_not_via_bash_wrapper
    description: |
      TRUE when a unit of work implemented entirely in one language is launched
      directly with that language's runner — `uv` for Python, `bun` for
      TypeScript/JavaScript — rather than through a shell script that exists only
      to call it.
      FALSE when a Bash/shell script's real purpose is just to invoke a single
      single-language program: its substantive work reduces to one `uv`/`python`
      call or one `bun`/`node` call, with no genuine shell orchestration
      (chaining several distinct tools, filesystem/OS setup, discovery loops,
      process management). Such a wrapper is the anti-pattern — fold the logic
      into the program and run it directly with uv or bun.
      A shell script that performs real multi-step orchestration is NOT a
      violation, even if some steps call uv or bun.
    # Scoped to *.sh (not relevance): shell scripts by definition, and this leaves
    # the justfile out — recipe bodies are wrappers by design.
    files:
      include:
        - "**/*.sh"
    require_line_attribution: true
    judges: 3
