# Monorepo buildout rules (plugin) — run ONCE during repo creation, then
# discarded. They verify the orchestration was wired correctly at setup.
version: 1

rules:
  - name: root_commands_delegate
    description: |
      when each root command recipe shells out to the orchestrator (for example `nx
      affected` or `nx run-many`) rather than hand-rolling a for-each-package loop.
    files:
      include: ["justfile", "Justfile", ".justfile"]

  - name: affected_only_explicit_base
    description: |
      when pull-request CI runs affected-only targets against an explicitly derived
      merge base and a full sweep runs on the main branch or nightly.
    files:
      include: [".github/workflows/**"]

  - name: project_boundaries_enforced
    description: |
      when projects declare tags and an enforced allowed-dependency rule, and target
      names are uniform across projects for the same logical task.
    files:
      include: ["nx.json", "**/project.json", "**/.eslintrc*", "eslint.config.*"]
