# Monorepo buildout rules (plugin) — run ONCE during repo creation, then
# discarded. They verify the orchestration was wired correctly at setup.
version: 1

rules:
  - name: root_commands_delegate
    description: |
      true when each root command recipe shells out to the orchestrator (for example
      `nx affected` or `nx run-many`). false when any recipe hand-rolls a
      for-each-package loop instead of delegating to the orchestrator.
    files:
      include: ["justfile", "Justfile", ".justfile"]

  - name: affected_only_explicit_base
    description: |
      true when pull-request CI runs affected-only targets against an explicitly
      derived merge base and a full sweep runs on the main branch or nightly. false
      when pull-request CI rebuilds the whole tree or derives no explicit base.
    files:
      include: [".github/workflows/**"]

  - name: project_boundaries_enforced
    description: |
      true when projects declare tags and an enforced allowed-dependency rule, and
      target names are uniform across projects. false when project boundaries are
      unenforced or target names differ for the same logical task across projects.
    files:
      include: ["nx.json", "**/project.json", "**/.eslintrc*", "eslint.config.*"]

  - name: each_deliverable_is_its_own_project
    description: |
      true when every app/package under the monorepo has its own project definition
      declaring its local targets (`build`, `lint`, `test`, `typecheck`) that call
      its own language-native tool. false when a deliverable has no project
      definition, so the orchestrator cannot run or cache it as an affected unit.
    files:
      include: ["nx.json", "**/project.json", "**/package.json", "**/Cargo.toml", "**/pyproject.toml"]

  - name: instruction_layer_localized
    description: |
      true when subtree rules live in a nested `AGENTS.md` inside each project and
      `CODEOWNERS` routes reviews, leaving the root `AGENTS.md` to repo-wide
      constraints only. false when project-specific rules are piled into the root
      `AGENTS.md`, or there is no ownership routing.
    files:
      include: ["**/AGENTS.md", "CODEOWNERS", ".github/CODEOWNERS", "docs/CODEOWNERS"]
