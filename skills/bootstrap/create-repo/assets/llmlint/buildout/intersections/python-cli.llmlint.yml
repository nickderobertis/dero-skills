# Python-CLI buildout rules (plugin) — run ONCE during repo creation, then
# discarded. Carries the one-time packaging check.
version: 1

rules:
  - name: console_entry_point
    description: |
      true when the CLI is declared as a `project.scripts` entry point in
      `pyproject.toml`, so it installs as a real command. false when the CLI is only
      runnable via `python -m` with no console entry point declared.
    files:
      include: ["pyproject.toml"]
