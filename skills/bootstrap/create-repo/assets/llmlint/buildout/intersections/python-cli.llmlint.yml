# Python-CLI buildout rules (plugin) — run ONCE during repo creation, then
# discarded. Carries the one-time packaging check.
version: 1

rules:
  - name: console_entry_point
    description: |
      when the CLI is declared as a `project.scripts` entry point in `pyproject.toml`,
      so it installs as a real command rather than being runnable only via `python -m`.
    files:
      include: ["pyproject.toml"]
