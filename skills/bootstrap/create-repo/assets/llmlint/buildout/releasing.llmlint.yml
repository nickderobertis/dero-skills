# Releasing buildout rules (plugin) — run ONCE during repo creation, then
# discarded. They verify the release pipeline was wired correctly at setup.
version: 1

rules:
  - name: no_manual_deploy_step
    description: |
      when the only human action in a release is merging a PR — no release step
      requires a manual command, a "Run workflow" click, or hand-editing a version
      number.
    files:
      include:
        - ".github/workflows/**"
        - "release-plz.toml"
        - ".releaserc*"
        - "release-please*"

  - name: versioning_decoupled_from_building
    description: |
      when the version job only computes the version and writes the changelog,
      manifests, lockfiles, and tag, and a separate workflow builds and publishes on
      the tag rather than the version job building or publishing artifacts itself.
    files:
      include:
        - ".github/workflows/**"
        - "release-plz.toml"
        - ".releaserc*"
        - "release-please*"

  - name: release_job_uses_pat
    description: |
      when the release or version job authenticates with a PAT or GitHub App token
      rather than the default `GITHUB_TOKEN` (whose tag push does not fire downstream
      release or publish workflows).
    files:
      include: [".github/workflows/**"]

  - name: publish_idempotent
    description: |
      when publishing skips a version that is already live and reads registry tokens
      from secrets, so a re-run cannot double-publish and no token is committed in the
      tree.
    files:
      include: [".github/workflows/**"]
    relevance: the repository publishes to a package registry
