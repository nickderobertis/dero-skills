# Project-graph buildout rules (plugin) — run ONCE during repo creation, then
# discarded. They verify the mandatory Nx project graph was wired correctly at
# setup.
version: 1.2.0

rules:
  - name: root_commands_delegate
    description: |
      true when each root command recipe shells out to the orchestrator (for example
      `nx affected` or `nx run-many`). false when any recipe hand-rolls a
      for-each-package loop instead of delegating to the orchestrator.
    files:
      include: ["justfile", "Justfile", ".justfile"]
    require_line_attribution: true

  - name: affected_only_explicit_base
    description: |
      true when pull-request CI runs affected-only targets against an explicitly
      derived merge base and a full sweep runs on the main branch or nightly.
    files:
      include: [".github/workflows/**"]

  - name: project_boundaries_enforced
    description: |
      true when projects declare tags and an enforced allowed-dependency rule, and
      target names are uniform across projects.
    files:
      include: ["nx.json", "**/project.json", "**/.eslintrc*", "eslint.config.*"]

  - name: each_deliverable_is_its_own_project
    description: |
      true when every app/package in the repo has its own project definition
      declaring its local targets (`build`, `lint`, `test`, `typecheck`) that call
      its own language-native tool.
    files:
      include: ["nx.json", "**/project.json", "**/package.json", "**/Cargo.toml", "**/pyproject.toml"]

  - name: graph_splits_by_tier_and_cost
    description: |
      true when the project graph splits the repo's work beyond its deliverables:
      the unit, integration, and e2e tiers are separate projects, and every slow or
      external-service-touching suite is its own project depending only on what it
      tests. false when the whole repo is one project, or an expensive suite rides
      along inside a broadly-depended-on project.
    files:
      include: ["nx.json", "**/project.json", "**/e2e/**", "**/integration/**"]

  - name: language_workspace_resolves_dependencies
    description: |
      true when the repo's projects are declared to the language's own workspace
      primitive as well as to Nx — a uv workspace, a Cargo workspace, or
      bun/pnpm workspaces — with ONE lockfile per language ecosystem covering them
      all. false when each project carries its own lockfile for the same ecosystem,
      or dependency resolution is hand-wired per project because only Nx knows the
      projects exist.
    files:
      include:
        - "nx.json"
        - "**/project.json"
        - "pyproject.toml"
        - "uv.lock"
        - "Cargo.toml"
        - "Cargo.lock"
        - "package.json"
        - "bun.lock"
        - "pnpm-workspace.yaml"
    relevance: the repo declares third-party dependencies in a language ecosystem with a workspace primitive
