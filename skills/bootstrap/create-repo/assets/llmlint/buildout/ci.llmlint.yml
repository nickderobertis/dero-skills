# CI buildout rules (plugin) — run ONCE during repo creation, then discarded.
# These verify the CI was set up right; they are not an ongoing PR check.
version: 1

rules:
  - name: ci_runs_the_real_gate
    description: |
      when CI bootstraps a clean checkout and runs the full `just check` gate rather
      than omitting it or running only a reduced subset.
    files:
      include: [".github/workflows/**", "justfile", "Justfile", ".justfile"]

  - name: install_path_matches_docs
    description: |
      when the CI end-user install job installs the artifact via the exact command the
      README documents.
    files:
      include: [".github/workflows/**", "**/README*"]
    relevance: the repository ships an installable artifact
