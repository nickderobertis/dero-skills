# Rust judge-level rules (plugin). Pairs with languages/rust.md.
version: 1

rules:
  - name: invalid_states_unrepresentable
    description: |
      when the domain and boundary types in the target files use newtypes and enums
      so that invalid states cannot be represented, rather than modelling a domain or
      boundary value with a bare bool or a stringly-typed value where a newtype or
      enum is the natural choice.
    files:
      include: ["**/*.rs"]
      exclude: ["**/tests/**", "**/*_test.rs", "**/benches/**"]
    relevance: the target files define domain types or model boundary data

  - name: no_panics_on_recoverable_errors
    description: |
      when every fallible operation in the target files returns or propagates an
      error (`Result`, `?`) rather than using `unwrap()`, `expect()`, or `panic!` for
      an error that is recoverable.
    files:
      include: ["**/*.rs"]
      exclude: ["**/tests/**", "**/*_test.rs", "**/benches/**"]
