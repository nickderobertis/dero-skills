# Skills-repo judge-level rules (plugin). Pairs with shapes/skills-repo.md.
version: 1

rules:
  - name: scripts_runtime_independent
    description: |
      when every bundled skill script in the target files is self-contained (PEP 723
      inline metadata for Python, Node built-ins for JavaScript) and depends on no
      orchestrator, repo-root manifest or lockfile, asdf or direnv, or import from the
      repo's own source tree.
    files:
      include:
        - "skills/**/*.py"
        - "skills/**/*.js"
        - "skills/**/*.mjs"
        - "skills/**/scripts/**"

  - name: determinism_vs_judgment
    description: |
      when the deterministic steps described in the target files are implemented as
      scripts and prose is reserved for genuine judgment, rather than a SKILL.md or
      AGENTS.md narrating step-by-step deterministic actions that a script should own.
    files:
      include:
        - "**/SKILL.md"
        - "**/AGENTS.md"
        - "**/CLAUDE.md"

  - name: skill_description_trigger_oriented
    description: |
      when every SKILL.md `description` in the target files is trigger-oriented
      (states when to use the skill, e.g. "Use when …") and `compatibility` states
      the skill's real runtime needs.
    files:
      include: ["**/SKILL.md"]
