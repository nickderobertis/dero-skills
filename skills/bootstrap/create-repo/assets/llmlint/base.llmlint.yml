# Standard llmlint config — the org-wide rules every repo gets, regardless of
# stack. Consumed as a plugin: the composer wires it into the generated
# top-level llmlint.yml (always first, after the bundled config_lint plugin).
# These are the ONGOING judgment checks an LLM judge can make that deterministic
# linters can't; keep using ruff/clippy/biome/shellcheck/tsc for what they cover.
#
# `version` is the published plugin version consumers pin with `@` (e.g. `@1`);
# bump it (and the content) to push new rules to every repo that pins it.
version: 1

rules:
  - name: e2e_not_mocked
    description: |
      when every end-to-end or integration test in the target files drives the real
      artifact across real boundaries (the entry point as a subprocess, real temp
      files, a real local server or database) rather than mocking the network,
      filesystem, subprocess, or the entry point it is meant to exercise.
    files:
      include:
        - "**/e2e/**"
        - "**/tests/e2e/**"
        - "**/*e2e*"
        - "**/integration/**"
        - "**/*.integration.*"

  - name: tests_assert_real_behavior
    description: |
      when every test in the target files asserts on an observable outcome (a
      returned value, an exit code, persisted state) rather than exercising code
      without asserting any behavior.
    files:
      include:
        - "**/tests/**"
        - "**/test_*.py"
        - "**/*_test.py"
        - "**/*_test.rs"
        - "**/*_test.go"
        - "**/*.test.ts"
        - "**/*.test.tsx"
        - "**/*.spec.ts"
        - "**/*.spec.tsx"
        - "**/e2e/**"

  - name: suppressions_justified
    description: |
      when every linter or type-checker suppression directive in the target files
      (`# noqa`, `eslint-disable`, `#[allow(...)]`, `# type: ignore`, `@ts-ignore`)
      carries a brief reason for the suppression.

  - name: boundary_inputs_validated
    description: |
      when every external or IO input read in the target files (request bodies,
      environment variables, config files, third-party responses, CLI arguments,
      stdin) is validated at the boundary before use.
    relevance: the target files read external or IO input

  - name: diagnostics_error_or_absent
    description: |
      when the quality gate treats every diagnostic as a hard failure or does not
      report it at all — no linter, type checker, or compiler is left configured to
      emit warning-level output. Warnings that neither fail the gate nor get fixed
      only bloat context, so a check is either strict or removed, never warning-only.
    files:
      include:
        - "justfile"
        - "Justfile"
        - ".justfile"
        - ".github/workflows/**"

  - name: tool_output_is_signal
    description: |
      when every script or command recipe in the target files is quiet on success (a
      single line or nothing) and, on failure, prints the exact error plus a concrete
      next action.
    files:
      include:
        - "scripts/**"
        - "**/scripts/**"
        - "bin/**"
        - "**/*.sh"
        - "justfile"
        - "Justfile"
        - ".justfile"

  - name: agents_md_durable_and_terse
    description: |
      when each durable instruction file in the target files (AGENTS.md, CLAUDE.md,
      and a skill's SKILL.md) reads as durable, terse instructions — the constraints,
      tradeoffs, and judgment a future maintainer or agent needs — rather than a
      session or changelog narrative, or a restatement of what a command, a failing
      gate, or a linked doc already shows.
    files:
      include:
        - "**/AGENTS.md"
        - "**/CLAUDE.md"
        - "**/SKILL.md"
