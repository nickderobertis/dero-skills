# CI judge-level rules (plugin). Pairs with ci.md. Always pulled in (ci.md is
# always composed). Structural one-time CI checks are buildout-only — see
# buildout/ci.llmlint.yml.
version: 1

rules:
  - name: live_tier_compiles_and_requires_credential
    description: |
      true when every live or integration test in the target files stays compiled
      (never `#[cfg]`'d out or deleted) and its workflow requires the credential,
      failing fast with a clear message when it is absent. false when a live test is
      excluded from compilation, or its workflow skips or no-ops to a green pass when
      the credential is missing — reporting a live path as covered when it never ran.
    files:
      include:
        - ".github/workflows/**"
        - "**/tests/live/**"
        - "**/*live*"
    relevance: the target files define a live or integration test tier

  - name: no_untrusted_interpolation_in_run
    description: |
      when a workflow reads untrusted event data (`${{ github.event.* }}` — a PR title,
      body, branch name, or comment) only by binding it to an `env:` variable and then
      referencing that variable inside `run:` (e.g. `env: TITLE: ${{ github.event.pull_request.title }}`
      then `run: echo "$TITLE"`), never by expanding `${{ github.event.* }}` literally in
      the `run:` script text. Event data mapped into `env:`, `with:`, `if:`, or an action's
      inputs is compliant — only a `${{ github.event.* }}` expansion written directly in a
      `run:` block, where a crafted value is parsed as shell, is a violation.
    files:
      include:
        - ".github/workflows/**"
    relevance: the target files define a GitHub Actions workflow with a `run:` step

  - name: ci_invokes_gate_recipe_not_inline_stages
    description: |
      true when a workflow job that runs the quality gate invokes the project's single
      gate recipe (e.g. `just check`) rather than re-listing its individual stages
      (format check, lint, type check, unit tests, e2e) as inline commands. false when a
      job reimplements gate stages inline, so the gate CI runs can silently drift out of
      parity with the one a contributor runs locally. A job that legitimately runs
      something outside the gate (a separate install-smoke, live-test, or release job) is
      not a violation.
    files:
      include:
        - ".github/workflows/**"
    relevance: the target files define a CI job that runs the quality gate

  - name: version_pins_in_lockstep
    description: |
      true when a toolchain or dependency version declared in more than one place (e.g.
      `.tool-versions`, a CI `setup-*` action or matrix entry, a `Dockerfile`, or docs)
      holds the same value across all of them, or a single reconciling check keeps them
      consistent. false when the same tool is pinned to divergent versions across files,
      so local and CI can silently run different toolchains.
    files:
      include:
        - ".tool-versions"
        - ".github/workflows/**"
        - "**/Dockerfile*"
        - "**/*.md"
    relevance: the target files pin a toolchain or dependency version that also appears elsewhere in the repo
