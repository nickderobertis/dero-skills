# CI judge-level rules (plugin). Pairs with ci.md. Always pulled in (ci.md is
# always composed). Structural one-time CI checks are buildout-only — see
# buildout/ci.llmlint.yml.
version: 1

rules:
  - name: live_tier_compiles_and_fails_closed
    description: |
      when every live or integration test in the target files stays compiled (never
      `#[cfg]`'d out or deleted) and, wherever its credential is expected, fails fast
      with a clear message on a missing credential rather than skipping or no-oping
      to a green pass — a silent no-op reports a live path as covered when it never
      ran. Fork pull requests stay safe by gating the whole job off at the workflow
      level (forks cannot hold the secret), not by a test that passes without running.
    files:
      include:
        - ".github/workflows/**"
        - "**/tests/live/**"
        - "**/*live*"
    relevance: the target files define a live or integration test tier
