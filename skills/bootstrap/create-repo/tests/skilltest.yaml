# skilltest config for the create-repo e2e, passed explicitly via
# `run_skill(config=...)` (it is NOT auto-discovered: skilltest only auto-loads a
# `skilltest.yaml` from the harness's cwd, which here is the throwaway workspace).
#
# The one thing it changes from the defaults: raise the harness run timeout. A
# full repo bootstrap far exceeds oneharness's 120s default, which otherwise kills
# the run mid-flight. Platform/model come from the runner's `run_skill` call.
provider:
  kind: oneharness
  bin: oneharness
  judge_harness: claude-code
  timeout_secs: 1500
