# Comment on every pull request with the lint and type-check suppressions it adds.
#
# This repo's gates can be bought two ways: fix the finding, or silence it. The
# `check`/`llmlint` jobs cannot tell the difference — a `# noqa` or an
# `llmlint: ignore` scrolls past review unremarked. This posts one sticky comment
# naming every suppression the PR introduced, with its rules, its stated reason,
# and a link to the line, so a high-level review sees the checks it switched off.
#
# Deliberately NOT a required status check (unlike `check`/`commitlint`/`llmlint`):
# it skips fork pull requests, whose read-only token cannot upsert a comment, and a
# required context that never reports would block them forever. It is a review
# artifact, not a gate.
#
# Kept in step with the create-repo asset it dogfoods:
# skills/bootstrap/create-repo/assets/notignored.yml.template.

name: notignored

on:
  pull_request:

# Least privilege: read the tree, write the one sticky comment, nothing else.
permissions:
  contents: read
  pull-requests: write

# Cancel superseded runs on the same ref: only the newest comment is wanted.
concurrency:
  group: notignored-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suppressions:
    # A fork's pull request is granted a read-only token, so the comment upsert
    # would fail on something the contributor has no way to fix.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The scan diffs against the base branch, which a shallow checkout omits.
          fetch-depth: 0

      # `@v0` is a floating major tag: it follows every 0.x release and moves only
      # once that release's artifacts have published. Defaults everywhere else —
      # `diff-base` is the PR's base branch, `paths` the whole repo.
      - uses: nickderobertis/notignored@v0
