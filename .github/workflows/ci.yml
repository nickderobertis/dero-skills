name: ci

on:
  push:
    branches: [main]
  pull_request:
    # `edited` re-runs commitlint when a PR title is fixed; the heavy `check`
    # job skips that action (the title edit doesn't change the head SHA).
    types: [opened, edited, reopened, synchronize]

# husky's `prepare` script must not configure local git hooks inside CI.
env:
  HUSKY: "0"

jobs:
  check:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Set up Node (for the Nx authoring toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install just
        uses: extractions/setup-just@v2

      # Prove the artifact from a clean checkout: bootstrap, then the full gate
      # (format check, lint, skill validation, version consistency, tests, and
      # the baseline self-check).
      - name: Bootstrap
        run: just bootstrap

      - name: Check
        run: just check

  commitlint:
    # Conventional-Commits gate for PRs. With squash-merge the PR title becomes
    # the commit subject semantic-release reads, so we lint the title.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | bunx commitlint

  llmlint:
    # Blocking LLM-as-judge lint of the cross-language launch conventions, scoped
    # to the files this PR changed (the merge-base diff with main). Uses the
    # committed harness — Codex + gpt-5.5 — so it needs an OpenAI key in repo
    # secrets (OPENAI_API_KEY). Mark this job a required status check in branch
    # protection to make it truly block merges (alongside `check`/`commitlint`).
    name: llmlint (changed files)
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      # Check out the PR head (not the synthetic merge ref) with full history so
      # the merge-base with main resolves.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch main (diff base)
        run: git fetch --no-tags --depth=2147483647 origin main

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install Codex CLI (the committed harness)
        run: |
          bun add -g @openai/codex
          bun pm bin -g >> "$GITHUB_PATH"

      - name: Install llmlint toolchain (oneharness + llmlint)
        run: |
          ./scripts/setup-llmlint.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint changed files
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Fail with a clear, actionable message instead of an opaque
          # "no JSON value could be extracted" when the harness has no credential.
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::llmlint needs a Codex credential. Add an OPENAI_API_KEY repo secret" \
                 "(Settings → Secrets and variables → Actions), or switch this job to a harness" \
                 "you have a key for. See the 'Optional LLM lint' section in AGENTS.md." >&2
            exit 1
          fi
          just lint-llm-diff origin/main

  release:
    # Automated release on main: derive the version from Conventional Commits
    # and publish a GitHub Release + tag. Runs only after the gate passes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx semantic-release
